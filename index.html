    <!-- Single Page Apps for GitHub Pages: restore the real URL that 404.html
         encoded (https://github.com/rafgraph/spa-github-pages) so react-router
         can render deep links / refreshes like /PORTFOLIO/about. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
